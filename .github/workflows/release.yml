name: Release

# Push a tag like v0.1.0-rc.1 or v0.1.0 to build and publish a release. The notes come from
# CHANGELOG.md, never from commit subjects.
#
# Two jobs. `verify` has no secrets and no environment: it checks that the tag points at a
# commit that is on main, then runs the vet, the tests and the notices check (the only place
# repository code is executed). `release` needs it, runs in the `release` environment (which
# holds the signing key and accepts only v* tags), and builds through GoReleaser. It runs
# no test code and none of the repository's scripts (the release notes come from verify as
# an artifact), but GoReleaser does what .goreleaser.yaml on the tagged commit says, so
# whoever can push to main and create a tag can still reach the key: keep that access small. The environment
# does not require a reviewer (the owner chose not to), so the controls are the verify job,
# the tag-on-main check and the tag ruleset.
#
# The release is signed: checksums.txt is signed with the AWXCTL_SIGNING_KEY
# secret (an ed25519 SSH key) into checksums.txt.sig, which `awxctl upgrade`
# verifies against the public key compiled into the binary. Once the repository
# is public the archives and checksums also get build-provenance attestations,
# checkable with `gh attestation verify`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must point at a commit that is on main
        run: |
          # The checkout above (fetch-depth: 0) already brought origin/main. The extra fetch
          # refreshes it where it can; in a private repository it has no credentials (they are
          # deliberately not kept) and fails, and the checkout's copy is used. Without an
          # origin/main the check below fails, so nothing is released.
          git fetch --no-tags origin main 2>/dev/null || echo "no credentials for a second fetch: using origin/main from the checkout"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main: not releasing"; exit 1; }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26"   # the newest 1.26.x patch (1.25 is out of support): releases and CI carry the stdlib fixes
          check-latest: true   # the newest patch, not the one cached on the runner: a cached patch can lack a security fix
      - name: Test before releasing
        run: |
          go vet ./...
          go test ./...
          go run scripts/notices/main.go | diff -u THIRD_PARTY_NOTICES.md -
      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

  release:
    needs: verify
    runs-on: ubuntu-latest
    # The signing key lives in the `release` environment, which holds it and restricts it to
    # v* tags. It does not require a reviewer: a v* tag on a commit that is on main is signed
    # and published without anyone approving it (the verify job and the tag ruleset are the
    # controls).
    environment: release
    permissions:
      contents: write       # publish the release
      id-token: write       # attestations
      attestations: write   # attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false   # the token does not sit in .git/config next to the signing key
      - name: The tag must point at a commit that is on main
        run: |
          # The checkout above (fetch-depth: 0) already brought origin/main. The extra fetch
          # refreshes it where it can; in a private repository it has no credentials (they are
          # deliberately not kept) and fails, and the checkout's copy is used. Without an
          # origin/main the check below fails, so nothing is released.
          git fetch --no-tags origin main 2>/dev/null || echo "no credentials for a second fetch: using origin/main from the checkout"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main: not releasing"; exit 1; }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26"
          check-latest: true   # the newest patch, not the one cached on the runner: a cached patch can lack a security fix
      # The notes were written by the verify job, which has no secrets: this job does not
      # run the repository's scripts next to the signing key.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      - name: Put the release notes in place
        run: cp "$RUNNER_TEMP/notes/release-notes.md" "$RUNNER_TEMP/release-notes.md"
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.0
      - name: Put the signing key in place
        env:
          AWXCTL_SIGNING_KEY: ${{ secrets.AWXCTL_SIGNING_KEY }}
        run: |
          if [ -z "$AWXCTL_SIGNING_KEY" ]; then echo "the AWXCTL_SIGNING_KEY secret is not set"; exit 1; fi
          umask 077
          printf '%s\n' "$AWXCTL_SIGNING_KEY" > "$RUNNER_TEMP/awxctl_signing_key"
          echo "AWXCTL_SIGNING_KEY_FILE=$RUNNER_TEMP/awxctl_signing_key" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.19.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build the tag that was pushed. Without this GoReleaser takes the highest tag on the
          # commit, which for v0.1.0 on the same commit as v0.1.0-rc.1 is the rc: it would
          # rebuild 0.1.0-rc.1 under the final tag.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/awxctl_signing_key"
      # GoReleaser's own notes are disabled (they would be commit subjects), and it ignores
      # --release-notes when the changelog is disabled, so the body is set from CHANGELOG.md here.
      - name: Set the release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Attest build provenance (public repositories)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
